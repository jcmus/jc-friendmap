<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>지인 지도 — Friend Map</title>

<!-- 홈 화면에 설치해 앱처럼 쓰기 위한 설정 (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4ed8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="지인 지도">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header id="sidebar-header">
      <h1>👥 지인 지도</h1>
      <p class="subtitle">지인들의 근무지를 한눈에</p>
    </header>

    <div id="toolbar">
      <button id="btn-locate" class="btn btn-primary" title="내 현재 위치로 이동">📍 내 위치</button>
      <button id="btn-add" class="btn" title="지인 추가">➕ 지인 추가</button>
      <div class="toolbar-row">
        <button id="btn-import" class="btn btn-small" title="엑셀 파일에서 지인 목록 가져오기">📥 엑셀 가져오기</button>
        <button id="btn-export" class="btn btn-small" title="현재 지인 목록을 엑셀로 저장">📤 엑셀 내보내기</button>
        <button id="btn-template" class="btn btn-small" title="엑셀 입력 양식 다운로드">📄 양식</button>
      </div>
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv" hidden>
    </div>

    <div id="import-status" hidden></div>

    <div id="search-box">
      <input type="text" id="search" placeholder="이름·회사·직책 검색…">
    </div>

    <ul id="friend-list"></ul>

    <footer id="sidebar-footer">
      <span id="friend-count"></span>
    </footer>
  </aside>

  <div id="map"></div>

  <!-- 지인 추가/수정 폼 -->
  <div id="form-overlay" hidden>
    <div id="friend-form-panel">
      <div id="form-header">
        <h2 id="form-title">지인 추가</h2>
        <button type="button" id="btn-close" title="닫기 (Esc)" aria-label="닫기">✕</button>
      </div>
      <form id="friend-form">
        <input type="hidden" id="f-id">
        <label>성명 *<input type="text" id="f-name" required placeholder="홍길동"></label>
        <label>전화번호<input type="tel" id="f-phone" placeholder="010-1234-5678"></label>
        <label>근무처 전화<input type="tel" id="f-workphone" placeholder="02-1234-5678"></label>
        <label>직책<input type="text" id="f-title" placeholder="과장"></label>
        <label>부서<input type="text" id="f-department" placeholder="영업부"></label>
        <label>이메일<input type="email" id="f-email" placeholder="hong@example.com"></label>
        <label>회사명<input type="text" id="f-company" placeholder="주식회사 예시"></label>
        <label>회사 주소 *<textarea id="f-address" required rows="2" placeholder="서울특별시 강남구 테헤란로 152&#10;(해외 주소도 가능: 1600 Amphitheatre Pkwy, Mountain View, CA)"></textarea></label>
        <div id="geocode-status" hidden></div>
        <div class="form-buttons">
          <button type="submit" class="btn btn-primary" id="btn-save">저장</button>
          <button type="button" class="btn" id="btn-cancel">취소</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // 서비스 워커는 https 또는 localhost 에서만 등록된다.
  // 실패해도 앱 동작에는 영향이 없으므로 조용히 넘어간다.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
