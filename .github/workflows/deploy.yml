name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 안전장치 1: 개인정보 데이터가 저장소에 실수로 커밋되면 배포를 중단한다.
      - name: 개인정보 파일 검사
        run: |
          if [ -e data/friends.json ] || [ -e data/geocode-cache.json ]; then
            echo "::error::개인정보 데이터 파일이 저장소에 포함되어 있습니다. 배포를 중단합니다."
            exit 1
          fi
          if ls *.csv *.xlsx 2>/dev/null | grep -q .; then
            echo "::error::CSV/XLSX 파일이 저장소에 포함되어 있습니다. 배포를 중단합니다."
            exit 1
          fi
          echo "개인정보 파일 없음 — 배포를 진행합니다."

      - uses: actions/configure-pages@v5

      # 안전장치 2: 배포 대상을 화이트리스트로 명시한다.
      # 여기 적힌 파일만 인터넷에 올라가므로, data/ 폴더는 어떤 경우에도 배포되지 않는다.
      - name: 배포할 앱 파일만 복사
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r js _site/
          ls -laR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
